name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore CoinSelection.slnx --locked-mode
      - run: dotnet build CoinSelection.slnx -c Release --no-restore
      - run: dotnet test --solution CoinSelection.slnx -c Release --no-build
      - run: dotnet run --project examples/CoinSelection.Example -c Release --no-build
      - run: dotnet pack src/CoinSelection -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/CoinSelection.NBitcoin -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/packages/*.nupkg
